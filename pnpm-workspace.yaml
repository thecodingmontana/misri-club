# apps/* are the things people run (the web app now; desktop and React Native later),
# packages/* is code they share once a second app needs it.
packages:
  - apps/*
  - packages/*
allowBuilds:
  libsql: true
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  # its install script would set up git hooks; the root prepare script does that instead
  simple-git-hooks: false
# seroval < 1.6.11 has injection advisories (GHSA-9wx9-5pv9-3349 and the
# typed-array constructor one); TanStack allows ^1.6.7, so force the patch.
overrides:
  seroval: ^1.6.11
  # one tslib 2 for everything: with two versions the server bundle kept only
  # half of one (no modules/), and @better-auth/passkey crashed every request
  'tslib@^2': ^2.9.1
  # one graphql for everything: GraphQL Armor's packages pin graphql 16, and
  # with two copies Yoga can't tell their errors apart from crashes
  '@escape.tech/graphql-armor-block-field-suggestions>graphql': ^17.1.0
  '@escape.tech/graphql-armor-cost-limit>graphql': ^17.1.0
  '@escape.tech/graphql-armor-max-aliases>graphql': ^17.1.0
  '@escape.tech/graphql-armor-max-depth>graphql': ^17.1.0
  '@escape.tech/graphql-armor-max-directives>graphql': ^17.1.0
  '@escape.tech/graphql-armor-max-tokens>graphql': ^17.1.0
  '@escape.tech/graphql-armor-types>graphql': ^17.1.0
  '@escape.tech/graphql-armor>graphql': ^17.1.0
