name: Android app

# Builds the Misri app's APK (apps/mobile). Every run keeps it as a build
# artifact. Each change to the app merged into main is also published as a
# GitHub Release (mobile-v0.1.<run>), which becomes "latest": the website's
# download link (releases/latest/download/misri.apk) always gets the newest.
on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a build still running
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile

      # Firebase (push notifications); without the secret the APK has none
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "No Firebase: no push"; exit 0; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json

      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      # each build counts up, so a newer APK installs over an older one
      - name: Version
        working-directory: apps/mobile/android/app
        run: |
          case "$GITHUB_REF" in
            refs/tags/mobile-v*) name="${GITHUB_REF_NAME#mobile-v}" ;;
            refs/heads/main) name="0.1.${GITHUB_RUN_NUMBER}" ;;
            *) name="0.0.${GITHUB_RUN_NUMBER}-dev" ;;
          esac
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${name}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      # without these secrets the APK is signed with Expo's debug key: it
      # installs, but can't be updated by a properly signed one later
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing key: debug-signed build"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/misri-upload.keystore"
          mkdir -p ~/.gradle
          {
            echo "MISRI_UPLOAD_STORE_FILE=$RUNNER_TEMP/misri-upload.keystore"
            echo "MISRI_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MISRI_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MISRI_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk misri.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: misri-apk
          path: misri.apk

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v') || github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the history since the last app release, for its notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: misri-apk

      # "What's new", from the feat and fix commits that touched the app since
      # the previous app release; the app shows these when it offers the update
      - name: Release notes
        run: |
          # the last release before this commit (a pushed tag isn't its own predecessor)
          previous=$(git describe --tags --abbrev=0 --match 'mobile-v*' HEAD^ 2>/dev/null || true)
          python3 .github/scripts/release-notes.py "$previous" > notes.md
          # the APK's versionCode, which the app compares against its own
          echo "<!-- build: ${{ github.run_number }} -->" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: misri.apk
          # main: a new tag per build; a pushed tag: that tag
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('mobile-v0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Misri ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('mobile-v0.1.{0}', github.run_number) }}
          make_latest: true
          body_path: notes.md
